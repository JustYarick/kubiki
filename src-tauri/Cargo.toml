[package]
name = "kubiki"
version = "0.1.0"
license = "Apache-2.0"
description = "Kubiki - Modern Event-Driven Kubernetes Desktop IDE"
authors = ["Kubiki Team"]
edition = "2024"

[lib]
name = "kubiki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
desktop-devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Core K8s engine
kubiki-core = { path = "../crates/kubiki-core" }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Kubernetes client
kube = { version = "0.98", default-features = false, features = ["client", "runtime", "derive", "ws", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["latest"] }

# Terminal & PTY
portable-pty = "0.8"

# Error handling & Logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = "4"

[patch.crates-io]
# GTK3 requires glib 0.18. Backport the upstream VariantStrIter safety fix.
glib = { path = "../vendor/glib" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# Exercise the backported out-pointer fix with optimizer assumptions enabled.
[profile.test.package.glib]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
