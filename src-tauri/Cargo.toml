[package]
name = "kubiki"
version = "0.1.0"
description = "Kubiki - Modern Event-Driven Kubernetes Desktop IDE"
authors = ["Kubiki Team"]
edition = "2024"

[lib]
name = "kubiki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Kubernetes client
kube = { version = "0.98", default-features = false, features = ["client", "runtime", "derive", "ws", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["latest"] }

# Terminal & PTY
portable-pty = "0.8"

# Error handling & Logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
