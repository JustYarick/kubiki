name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag: ${{ steps.create-release.outputs.tag }}
      prerelease: ${{ steps.create-release.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          KUBIKI_UPDATER_PUBLIC_KEY: ${{ vars.KUBIKI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          script: |
            const { desktopRelease, normalizeUpdaterPublicKey } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/desktop-release.mjs`);
            const { tag, prerelease } = desktopRelease(process.env.RELEASE_TAG);
            if (!process.env.KUBIKI_UPDATER_PUBLIC_KEY?.trim() || !process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) {
              throw new Error('Configure the updater signing key and public key before publishing. See docs/APP_UPDATES.md.');
            }
            normalizeUpdaterPublicKey(process.env.KUBIKI_UPDATER_PUBLIC_KEY);
            core.setOutput('tag', tag);
            core.setOutput('prerelease', String(prerelease));
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Kubiki ${tag}`,
              draft: true,
              prerelease,
              make_latest: 'false',
              generate_release_notes: true
            });
            return data.id;

  build-tauri:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            node_arch: x64
            cli_bin: "crates/kubiki-core/target/x86_64-unknown-linux-gnu/release/kubiki-cli"
            cli_artifact: "kubiki-cli-linux-amd64"
          - platform: macos-15
            target: aarch64-apple-darwin
            node_arch: arm64
            cli_bin: "crates/kubiki-core/target/aarch64-apple-darwin/release/kubiki-cli"
            cli_artifact: "kubiki-cli-macos-arm64"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            node_arch: x64
            cli_bin: "crates/kubiki-core/target/x86_64-apple-darwin/release/kubiki-cli"
            cli_artifact: "kubiki-cli-macos-amd64"
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            node_arch: x64
            cli_bin: "crates/kubiki-core/target/x86_64-pc-windows-msvc/release/kubiki-cli.exe"
            cli_artifact: "kubiki-cli-windows-amd64.exe"

    env:
      KUBIKI_BUILD_TARGET: ${{ matrix.target }}
      KUBIKI_UPDATER_PUBLIC_KEY: ${{ vars.KUBIKI_UPDATER_PUBLIC_KEY }}
      MACOSX_DEPLOYMENT_TARGET: '13.5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.node_arch }}
          cache: 'pnpm'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/kubiki-core
            src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify desktop runtime target selection
        run: pnpm test:desktop

      - name: Prepare release versions and updater artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          KUBIKI_UPDATER_PUBLIC_KEY: ${{ vars.KUBIKI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/desktop-release.mjs "$RELEASE_TAG"

      - name: Build standalone CLI
        shell: bash
        run: |
          cargo build --release --locked --manifest-path crates/kubiki-core/Cargo.toml --bin kubiki-cli --target "${{ matrix.target }}"

      - name: Isolate AppImage tooling from the host OpenSSL configuration
        if: runner.os == 'Linux'
        shell: bash
        # The static appimagetool can deadlock while downloading its runtime when
        # it reads a newer host OpenSSL configuration (reproduced on openSUSE).
        run: echo "OPENSSL_CONF=/dev/null" >> "$GITHUB_ENV"

      - name: Build Desktop Application & Upload Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseDraft: true
          prerelease: ${{ needs.create-release.outputs.prerelease == 'true' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --config .kubiki-build/updater.conf.json -- --locked

      - name: Upload CLI to Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const release_id = ${{ needs.create-release.outputs.release_id }};
            const filePath = path.resolve('${{ matrix.cli_bin }}');
            if (fs.existsSync(filePath)) {
              console.log(`Uploading ${filePath} as ${{ matrix.cli_artifact }}`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release_id,
                name: '${{ matrix.cli_artifact }}',
                data: fs.readFileSync(filePath)
              });
            } else {
              throw new Error(`CLI artifact not found: ${filePath}`);
            }

  publish-release:
    name: Publish Release
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release validation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Validate updater manifest and publish GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const { desktopRelease, validateUpdateManifest } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/desktop-release.mjs`);
            const release = desktopRelease(process.env.RELEASE_TAG);
            const release_id = Number(process.env.RELEASE_ID);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner, repo: context.repo.repo, release_id, per_page: 100,
            });
            const manifest = assets.find(asset => asset.name === 'latest.json');
            if (!manifest) throw new Error('The updater manifest is missing. Keeping the release as a draft.');
            const { data } = await github.rest.repos.getReleaseAsset({
              owner: context.repo.owner, repo: context.repo.repo, asset_id: manifest.id,
              headers: { accept: 'application/octet-stream' },
            });
            validateUpdateManifest(JSON.parse(Buffer.from(data).toString('utf8')), release.tag, assets);
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              prerelease: release.prerelease,
              make_latest: release.prerelease ? 'false' : 'true',
              draft: false
            });
