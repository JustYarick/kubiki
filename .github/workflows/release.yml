name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom Tag (e.g. v1.0.1 or v1.0.1-dev.1). Leave empty to auto-generate.'
        required: false
        default: ''
      bump:
        description: 'Version bump if auto-generating (patch, minor, major)'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      target_commit:
        description: 'Optional commit SHA to release (leave empty for branch HEAD)'
        required: false
        default: ''
      force_rebuild:
        description: 'Force rebuild all targets even if artifacts exist'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.inputs.custom_tag || github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag: ${{ steps.create-release.outputs.tag }}
      prerelease: ${{ steps.create-release.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_commit || github.ref }}
          fetch-depth: 0

      - name: Create or find draft release
        id: create-release
        uses: actions/github-script@v7
        env:
          CUSTOM_TAG: ${{ github.event.inputs.custom_tag }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          TARGET_COMMIT: ${{ github.event.inputs.target_commit }}
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
          KUBIKI_UPDATER_PUBLIC_KEY: ${{ vars.KUBIKI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          script: |
            const { desktopRelease, normalizeUpdaterPublicKey } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/desktop-release.mjs`);

            if (!process.env.KUBIKI_UPDATER_PUBLIC_KEY?.trim() || !process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) {
              throw new Error('Configure the updater signing key and public key before publishing. See docs/APP_UPDATES.md.');
            }
            normalizeUpdaterPublicKey(process.env.KUBIKI_UPDATER_PUBLIC_KEY);

            const targetSha = process.env.TARGET_COMMIT?.trim() || context.sha;
            core.info(`Target commit SHA: ${targetSha}`);

            let tag = (process.env.CUSTOM_TAG?.trim() || process.env.INPUT_TAG?.trim());
            let isPrerelease = false;

            if (tag) {
              const parsed = desktopRelease(tag);
              tag = parsed.tag;
              isPrerelease = parsed.prerelease;
              core.info(`Using explicit tag: ${tag} (prerelease: ${isPrerelease})`);
            } else if (context.ref.startsWith('refs/tags/')) {
              tag = context.ref.replace('refs/tags/', '');
              const parsed = desktopRelease(tag);
              tag = parsed.tag;
              isPrerelease = parsed.prerelease;
              core.info(`Using push tag: ${tag} (prerelease: ${isPrerelease})`);
            } else {
              const branch = (context.ref || '').replace(/^refs\/(heads|tags)\//, '');
              const isMain = branch === 'main';
              const bumpType = process.env.BUMP || 'patch';

              // Fetch existing tags to find highest stable tag
              const tagsData = await github.paginate(github.rest.repos.listTags, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const allTags = new Set(tagsData.map(t => t.name));

              let maxStable = { major: 0, minor: 0, patch: 0 };
              for (const t of allTags) {
                const m = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(t);
                if (m) {
                  const [maj, min, pat] = [Number(m[1]), Number(m[2]), Number(m[3])];
                  if (maj > maxStable.major || (maj === maxStable.major && min > maxStable.minor) || (maj === maxStable.major && min === maxStable.minor && pat > maxStable.patch)) {
                    maxStable = { major: maj, minor: min, patch: pat };
                  }
                }
              }

              if (maxStable.major === 0 && maxStable.minor === 0 && maxStable.patch === 0) {
                try {
                  const fs = await import('fs');
                  const pkg = JSON.parse(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/package.json`, 'utf8'));
                  const m = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)/.exec(pkg.version);
                  if (m) {
                    maxStable = { major: Number(m[1]), minor: Number(m[2]), patch: Number(m[3]) };
                  }
                } catch {}
              }

              function bump(v, type) {
                if (type === 'major') return `${v.major + 1}.0.0`;
                if (type === 'minor') return `${v.major}.${v.minor + 1}.0`;
                return `${v.major}.${v.minor}.${v.patch + 1}`;
              }

              const nextVersion = bump(maxStable, bumpType);

              if (isMain) {
                tag = `v${nextVersion}`;
                isPrerelease = false;
              } else {
                tag = `v${nextVersion}-dev.${context.runNumber}`;
                isPrerelease = true;
              }

              core.info(`Auto-generated release tag ${tag} for branch ${branch} (isPrerelease: ${isPrerelease})`);
            }

            // Ensure git tag exists or create it
            let tagRefExists = false;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              tagRefExists = true;
              core.info(`Git tag ${tag} already exists on GitHub.`);
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            if (!tagRefExists) {
              core.info(`Creating git tag ref refs/tags/${tag} pointing to commit ${targetSha}...`);
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: targetSha,
              });
              core.info(`Successfully created git tag refs/tags/${tag}`);
            }

            core.setOutput('tag', tag);
            core.setOutput('prerelease', String(isPrerelease));

            let release;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              release = data;
              core.info(`Found existing release id ${release.id} for tag ${tag}`);
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            if (!release) {
              const releaseName = isPrerelease ? `Kubiki ${tag} (Dev Release)` : `Kubiki ${tag}`;
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: releaseName,
                draft: true,
                prerelease: isPrerelease,
                make_latest: 'false',
                generate_release_notes: true
              });
              release = data;
              core.info(`Created new draft release id ${release.id} for tag ${tag} (${releaseName})`);
            }
            return release.id;

  build-tauri:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            node_arch: x64
            cli_bin: "crates/kubiki-core/target/x86_64-unknown-linux-gnu/release/kubiki-cli"
            cli_artifact: "kubiki-cli-linux-amd64"
          - platform: macos-15
            target: aarch64-apple-darwin
            node_arch: arm64
            cli_bin: "crates/kubiki-core/target/aarch64-apple-darwin/release/kubiki-cli"
            cli_artifact: "kubiki-cli-macos-arm64"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            node_arch: x64
            cli_bin: "crates/kubiki-core/target/x86_64-apple-darwin/release/kubiki-cli"
            cli_artifact: "kubiki-cli-macos-amd64"
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            node_arch: x64
            cli_bin: "crates/kubiki-core/target/x86_64-pc-windows-msvc/release/kubiki-cli.exe"
            cli_artifact: "kubiki-cli-windows-amd64.exe"

    env:
      KUBIKI_BUILD_TARGET: ${{ matrix.target }}
      KUBIKI_UPDATER_PUBLIC_KEY: ${{ vars.KUBIKI_UPDATER_PUBLIC_KEY }}
      MACOSX_DEPLOYMENT_TARGET: '13.5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Check if artifacts for this target are already uploaded
        id: check-existing
        uses: actions/github-script@v7
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
        with:
          script: |
            if (process.env.FORCE_REBUILD === 'true') {
              core.info('Force rebuild requested. Proceeding with build.');
              core.setOutput('skip', 'false');
              return;
            }
            const { targetArtifactsUploaded } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/desktop-release.mjs`);
            const release_id = ${{ needs.create-release.outputs.release_id }};
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner, repo: context.repo.repo, release_id, per_page: 100,
            });
            const alreadyBuilt = targetArtifactsUploaded('${{ matrix.target }}', assets, '${{ matrix.cli_artifact }}');
            if (alreadyBuilt) {
              core.info(`Artifacts for ${{ matrix.target }} are already present on release ${release_id}. Skipping build!`);
              core.setOutput('skip', 'true');
            } else {
              core.info(`Artifacts for ${{ matrix.target }} not found or incomplete. Proceeding with build.`);
              core.setOutput('skip', 'false');
            }

      - name: Install pnpm
        if: steps.check-existing.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        if: steps.check-existing.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.node_arch }}
          cache: 'pnpm'

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && steps.check-existing.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Rust toolchain
        if: steps.check-existing.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        if: steps.check-existing.outputs.skip != 'true'
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            crates/kubiki-core
            src-tauri

      - name: Install frontend dependencies
        if: steps.check-existing.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify desktop runtime target selection
        if: steps.check-existing.outputs.skip != 'true'
        run: pnpm test:desktop

      - name: Prepare release versions and updater artifacts
        if: steps.check-existing.outputs.skip != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          KUBIKI_UPDATER_PUBLIC_KEY: ${{ vars.KUBIKI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/desktop-release.mjs "$RELEASE_TAG"

      - name: Build standalone CLI
        if: steps.check-existing.outputs.skip != 'true'
        shell: bash
        run: |
          cargo build --release --locked --manifest-path crates/kubiki-core/Cargo.toml --bin kubiki-cli --target "${{ matrix.target }}"

      - name: Isolate AppImage tooling from the host OpenSSL configuration
        if: runner.os == 'Linux' && steps.check-existing.outputs.skip != 'true'
        shell: bash
        run: echo "OPENSSL_CONF=/dev/null" >> "$GITHUB_ENV"

      - name: Build Desktop Application & Upload Bundles
        if: steps.check-existing.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseDraft: true
          prerelease: ${{ needs.create-release.outputs.prerelease == 'true' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --config .kubiki-build/updater.conf.json -- --locked

      - name: Upload CLI to Release
        if: steps.check-existing.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const release_id = ${{ needs.create-release.outputs.release_id }};
            const filePath = path.resolve('${{ matrix.cli_bin }}');
            if (!fs.existsSync(filePath)) {
              throw new Error(`CLI artifact not found: ${filePath}`);
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner, repo: context.repo.repo, release_id, per_page: 100,
            });
            const existing = assets.find(a => a.name === '${{ matrix.cli_artifact }}');
            if (existing) {
              core.info(`Deleting existing CLI asset ${existing.id}...`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.id,
              });
            }
            core.info(`Uploading ${filePath} as ${{ matrix.cli_artifact }}`);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release_id,
              name: '${{ matrix.cli_artifact }}',
              data: fs.readFileSync(filePath)
            });

      - name: Archive build artifacts to workflow
        if: steps.check-existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kubiki-build-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
            ${{ matrix.cli_bin }}
          if-no-files-found: ignore
          retention-days: 7

  publish-release:
    name: Publish Release
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release validation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Validate updater manifest and publish GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const { desktopRelease, validateUpdateManifest, reconcileUpdateManifest } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/desktop-release.mjs`);
            const release = desktopRelease(process.env.RELEASE_TAG);
            const release_id = Number(process.env.RELEASE_ID);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner, repo: context.repo.repo, release_id, per_page: 100,
            });

            let manifestAsset = assets.find(asset => asset.name === 'latest.json');
            let manifest = { platforms: {} };
            if (manifestAsset) {
              const { data } = await github.rest.repos.getReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo, asset_id: manifestAsset.id,
                headers: { accept: 'application/octet-stream' },
              });
              try {
                manifest = JSON.parse(Buffer.from(data).toString('utf8'));
              } catch (e) {
                core.warning(`Failed to parse existing latest.json: ${e.message}`);
              }
            }

            // Fetch signatures from release assets to reconcile any missing platforms
            const signatures = {};
            for (const asset of assets) {
              if (asset.name.endsWith('.sig') && asset.size > 0) {
                const { data } = await github.rest.repos.getReleaseAsset({
                  owner: context.repo.owner, repo: context.repo.repo, asset_id: asset.id,
                  headers: { accept: 'application/octet-stream' },
                });
                signatures[asset.name] = Buffer.from(data).toString('utf8').trim();
              }
            }

            const reconciled = reconcileUpdateManifest(manifest, release.tag, assets, signatures);
            validateUpdateManifest(reconciled, release.tag, assets);

            const manifestContent = JSON.stringify(reconciled, null, 2);
            if (manifestAsset) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo, asset_id: manifestAsset.id,
              });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner, repo: context.repo.repo, release_id,
              name: 'latest.json',
              data: Buffer.from(manifestContent),
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              prerelease: release.prerelease,
              make_latest: release.prerelease ? 'false' : 'true',
              draft: false
            });
            core.info(`Successfully published Kubiki ${release.tag}`);
