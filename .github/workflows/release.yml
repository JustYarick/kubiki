name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run frontend, browser, extension and Rust tests before building'
        type: boolean
        default: false
      publish:
        description: 'Publish built installers; disable for a build-only run'
        type: boolean
        default: true
      custom_tag:
        description: 'Optional release tag; existing tags build their exact commit'
        type: string
        default: ''
      bump:
        description: 'Version bump when custom_tag is empty'
        type: choice
        options: [patch, minor, major]
        default: patch
      target_commit:
        description: 'Optional full commit SHA; must match custom_tag if that tag exists'
        type: string
        default: ''
  workflow_call:
    inputs:
      run_tests:
        type: boolean
        default: true
      publish:
        type: boolean
        default: false
      custom_tag:
        type: string
        default: ''
      bump:
        type: string
        default: patch
      target_commit:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve commit, version and signing
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      run_tests: ${{ steps.plan.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan exact source and release channel
        id: plan
        uses: actions/github-script@v7
        env:
          PUBLISH: ${{ inputs.publish || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
          RUN_TESTS: ${{ inputs.run_tests || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
          CUSTOM_TAG: ${{ inputs.custom_tag }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          BUMP: ${{ inputs.bump || 'patch' }}
          KUBIKI_UPDATER_PUBLIC_KEY: ${{ (inputs.publish || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && vars.KUBIKI_UPDATER_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ (inputs.publish || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { pathToFileURL } = require('node:url');
            const load = name => import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/${name}`).href);
            const { desktopRelease, normalizeUpdaterPublicKey } = await load('desktop-release.mjs');
            const { nextReleaseTag, installerBundleConfig } = await load('desktop-pipeline.mjs');
            const git = args => execFileSync('git', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }).trim();
            const publish = process.env.PUBLISH === 'true';
            const runTests = process.env.RUN_TESTS === 'true';
            if (publish && context.eventName === 'pull_request') throw new Error('Pull requests cannot publish releases.');
            if (publish) {
              normalizeUpdaterPublicKey(process.env.KUBIKI_UPDATER_PUBLIC_KEY);
              if (!process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) throw new Error('Missing TAURI_SIGNING_PRIVATE_KEY. See docs/APP_UPDATES.md.');
            }
            const requestedSha = process.env.TARGET_COMMIT.trim();
            if (requestedSha && !/^[0-9a-f]{40}$/.test(requestedSha)) throw new Error('target_commit must be a full commit SHA.');
            let sha = git(['rev-parse', `${requestedSha || 'HEAD'}^{commit}`]);
            let tag = process.env.CUSTOM_TAG.trim() || (context.ref.startsWith('refs/tags/') ? context.ref.slice(10) : '');
            if (tag) {
              desktopRelease(tag);
              let taggedSha;
              try { taggedSha = git(['rev-parse', '--verify', `refs/tags/${tag}^{commit}`]); } catch {}
              if (taggedSha) {
                if (requestedSha && sha !== taggedSha) throw new Error(`${tag} does not match target_commit.`);
                sha = taggedSha;
              }
            } else {
              tag = nextReleaseTag(git(['tag', '--list', 'v*']).split('\n'), {
                bump: process.env.BUMP, branch: publish ? context.ref.replace('refs/heads/', '') : 'ci',
                runNumber: context.runNumber,
              });
            }
            installerBundleConfig(desktopRelease(tag).version);
            if (publish) {
              let existing;
              try { existing = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data; }
              catch (error) { if (error.status !== 404) throw error; }
              if (existing && !existing.draft) throw new Error(`${tag} is already published. Choose a new version.`);
            }
            core.setOutput('sha', sha);
            core.setOutput('tag', tag);
            core.setOutput('publish', String(publish));
            core.setOutput('run_tests', String(runTests));
            await core.summary.addHeading(publish ? `Release ${tag}` : `Build only: ${tag}`)
              .addTable([
                ['Source commit', sha],
                ['Tests', runTests ? 'Run frontend, browser, extension and Rust tests' : 'Skip tests; build and validate installers'],
                ['Mode', publish ? 'Publish signed packages after build validation' : 'Download installers from workflow artifacts'],
              ])
              .write();

  frontend:
    name: Frontend, extensions and pipeline tests
    needs: prepare
    if: needs.prepare.outputs.run_tests == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:desktop
      - run: pnpm desktop:prepare
      - run: pnpm test:extensions
      - run: node scripts/check-external-extension.mjs

  interface:
    name: Browser interface tests
    needs: prepare
    if: needs.prepare.outputs.run_tests == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm extensions:build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interface-test-results
          path: test-results/
          retention-days: 7

  desktop:
    name: Build installers (${{ matrix.target }})
    needs: [prepare, frontend, interface]
    # An explicit status function lets builds run after intentionally skipped
    # test jobs. Failed/cancelled required tests still block the build.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          ((needs.prepare.outputs.run_tests == 'false' &&
            needs.frontend.result == 'skipped' && needs.interface.result == 'skipped') ||
           (needs.prepare.outputs.run_tests == 'true' &&
            needs.frontend.result == 'success' && needs.interface.result == 'success')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      KUBIKI_BUILD_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '13.5'
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            crates/kubiki-core
            src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Prepare target runtime and extension resources
        run: |
          pnpm extensions:build
          pnpm desktop:prepare
      - name: Test core and desktop on the target OS
        if: needs.prepare.outputs.run_tests == 'true'
        run: |
          cargo test --locked --manifest-path crates/kubiki-core/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Set build version and updater configuration
        shell: bash
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          KUBIKI_UPDATER_PUBLIC_KEY: ${{ needs.prepare.outputs.publish == 'true' && vars.KUBIKI_UPDATER_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          if [ "$PUBLISH" = true ]; then
            node scripts/desktop-release.mjs "$RELEASE_TAG"
          else
            node scripts/desktop-release.mjs "$RELEASE_TAG" --unsigned
          fi
      - name: Build standalone CLI
        shell: bash
        run: cargo build --release --locked --manifest-path crates/kubiki-core/Cargo.toml --bin kubiki-cli --target "$KUBIKI_BUILD_TARGET"
      - name: Build and verify all installers
        shell: bash
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          args=(--target "$KUBIKI_BUILD_TARGET" --config .kubiki-build/updater.conf.json --stage)
          if [ "$PUBLISH" = true ]; then args+=(--signed); fi
          pnpm desktop:build "${args[@]}"
      - name: Upload verified installers, CLI and checksums
        uses: actions/upload-artifact@v4
        with:
          name: kubiki-${{ matrix.target }}
          path: .kubiki-build/artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified release
    needs: [prepare, desktop]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          needs.desktop.result == 'success' && needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: desktop-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: kubiki-*
          merge-multiple: true
          path: release-artifacts
      - name: Verify provenance and signatures, upload, then publish
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { publishDesktopRelease } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/publish-desktop-release.mjs`).href);
            await publishDesktopRelease({ github, context, core }, {
              tag: process.env.RELEASE_TAG, sha: process.env.SOURCE_SHA,
              dir: `${process.env.GITHUB_WORKSPACE}/release-artifacts`,
            });
