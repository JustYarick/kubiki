name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      trigger_release:
        description: 'Publish a signed release after tests and all desktop builds pass'
        type: boolean
        default: true
      custom_tag:
        description: 'Optional vX.Y.Z or vX.Y.Z-rc.1; empty = next stable on main, preview elsewhere'
        type: string
        default: ''
      bump:
        description: 'Version bump when custom_tag is empty'
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  pipeline:
    name: Tests, installers and release
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_release }}
      custom_tag: ${{ inputs.custom_tag || '' }}
      bump: ${{ inputs.bump || 'patch' }}
    secrets: inherit
