name: Feature request
description: Suggest an improvement to a Kubernetes workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow or problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current approach and alternatives
      description: How do you handle this today? What alternatives have you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant platforms, resource types, or examples without sharing credentials.
