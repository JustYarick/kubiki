[package]
name = "kubiki-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Portable Kubiki Kubernetes MCP server"
[dependencies]
kubiki-tools = { path = "../kubiki-tools" }
kubiki-core = { path = "../kubiki-core" }
rmcp = { version = "3.8.0", default-features = false, features = ["client", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
tokio-util = "0.7"

[dev-dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["transport-child-process"] }
