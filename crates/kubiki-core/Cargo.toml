[package]
name = "kubiki-core"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
description = "Kubiki Core - Complete Headless Kubernetes Engine (Informers, Exec, Port-Forward, Helm, Metrics, CRD Discovery)"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
http = "1"
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

# Kubernetes Client (CNCF)
kube = { version = "0.98", default-features = false, features = ["client", "runtime", "derive", "ws", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["latest"] }

# Terminal & PTY
portable-pty = "0.8"

# Error handling & Logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
tokio-tungstenite = "0.26"
